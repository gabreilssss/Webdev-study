<body>

    <img class="pfp_mom" src="eroni.png" alt="eroni">

    <h3>Parabéns pelos 58 anos de vida🥳</h3>

    <div class="mensagem">

        </h3>

        <img class="imagn" src="mae_e_gabriel.jpg" alt="mãe e gabriel">
    </div>

    <div class="mensagem">
        <h2>Mensagem da Bianca</h2>
        <h3>*mensagem*</h3>
        <img class="imagn" src="" alt="imagem Bianca e mãe">
    </div>

    <div class="mensagem">
        <h2>Mensagem do Brian</h2>
        <h3>*mensagem*</h3>
        <img class="imagn" src="" alt="imagem Brian e mãe">
    </div>

    <!-- Confetes -->
    <div id="confetes"></div>

    <!-- JavaScript -->
    <script>
        const container = document.getElementById("confetes");

        const cores = [
            "#ff4d6d",
            "#ffd166",
            "#06d6a0",
            "#118ab2",
            "#8338ec",
            "#ff8fab"
        ];

        function soltarConfetes() {
            for (let i = 0; i < 150; i++) {
                setTimeout(criarConfete, i * 20);
            }
        }

        function criarConfete() {
            const confete = document.createElement("div");

            confete.classList.add("confete");

            confete.style.left = Math.random() * 100 + "vw";

            confete.style.backgroundColor =
                cores[Math.floor(Math.random() * cores.length)];

            confete.style.animationDuration =
                (Math.random() * 3 + 2) + "s";

            confete.style.transform =
                `rotate(${Math.random() * 360}deg)`;

            container.appendChild(confete);

            setTimeout(() => {
                confete.remove();
            }, 5000);
        }
        for (let i = 0; i < 100; i++) {
    setTimeout(criarConfete, i * 30);
}
    </script>

</body>
