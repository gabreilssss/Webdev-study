<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Score counter</title>
</head>
<body>
     <div id="container">
        <div class="game">
            <div>
            <h3 class="score-title">HOME</h3>
            <h1 class="score" id="score-home-el">0</h1>
            <div class="scor-btn">
                <button class="btn-add" onclick="add('home', 1)">+1</button>
                <button class="btn-add" onclick="add('home', 2)">+2</button>
                <button class="btn-add" onclick="add('home', 3)">+3</button>

            </div>
        </div>
        <div>
            <h3 class="score-title">GUEST</h3>
            <h1 class="score" id="score-guest-el">0</h1>
            <div class="scor-btn">
                <button class="btn-add" onclick="add('guest', 1)">+1</button>
                <button class="btn-add" onclick="add('guest', 2)">+2</button>
                <button class="btn-add" onclick="add('guest', 3)">+3</button>

            </div>
        </div>

        </div>
    
        <div class="ng-btn">
            <button class="btn-add" onclick="newGame()">New game</button>
        </div>
     </div>
    <script src="index.js"></script>
</body>
</html>
