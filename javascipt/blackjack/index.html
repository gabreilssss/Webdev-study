<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Blackjack</title>
</head>
<body>
    <h1>Blackjack</h1>
    <p id="message-el">Want to play around?</p>

    <script src="index.js"></script>
    
</body>
</html>
